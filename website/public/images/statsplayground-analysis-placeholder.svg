<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">StatsPlayground analysis screenshot placeholder</title>
  <desc id="description">Replace this placeholder with a current StatsPlayground analysis screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f0" />
      <stop offset="1" stop-color="#dce7e1" />
    </linearGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#121715" fill-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)" />
  <rect width="1600" height="900" fill="url(#dots)" />
  <rect x="144" y="124" width="1312" height="652" rx="8" fill="#f8faf9" stroke="#121715" stroke-opacity="0.18" stroke-width="2" />
  <rect x="144" y="124" width="1312" height="64" rx="8" fill="#121715" />
  <circle cx="184" cy="156" r="8" fill="#ff806c" />
  <circle cx="214" cy="156" r="8" fill="#b9f7d4" />
  <circle cx="244" cy="156" r="8" fill="#f1f5f3" fill-opacity="0.6" />
  <path d="M310 640 C420 530 495 570 590 420 S780 520 880 330 1070 500 1285 270" fill="none" stroke="#ff806c" stroke-width="5" stroke-linecap="round" />
  <g fill="#121715">
    <circle cx="310" cy="640" r="10" /><circle cx="590" cy="420" r="10" /><circle cx="880" cy="330" r="10" /><circle cx="1285" cy="270" r="10" />
  </g>
  <rect x="445" y="322" width="710" height="256" rx="8" fill="#121715" fill-opacity="0.94" />
  <text x="800" y="407" fill="#f1f5f3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" text-anchor="middle">ANALYSIS RESULT MEDIA</text>
  <text x="800" y="467" fill="#b9f7d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" text-anchor="middle">SCREENSHOT PLACEHOLDER</text>
  <text x="800" y="527" fill="#d2dcd7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle">Replace statsplayground-analysis.webp</text>
</svg>