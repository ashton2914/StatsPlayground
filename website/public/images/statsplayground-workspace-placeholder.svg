<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">StatsPlayground workspace screenshot placeholder</title>
  <desc id="description">Replace this placeholder with a current StatsPlayground workspace screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121715" />
      <stop offset="1" stop-color="#25332d" />
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#b9f7d4" stroke-opacity="0.08" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <circle cx="1300" cy="180" r="220" fill="#b9f7d4" fill-opacity="0.08" />
  <circle cx="270" cy="760" r="280" fill="#ff806c" fill-opacity="0.08" />
  <rect x="144" y="124" width="1312" height="652" rx="8" fill="#18201d" stroke="#b9f7d4" stroke-opacity="0.28" stroke-width="2" />
  <rect x="144" y="124" width="1312" height="64" rx="8" fill="#202a26" />
  <circle cx="184" cy="156" r="8" fill="#ff806c" />
  <circle cx="214" cy="156" r="8" fill="#b9f7d4" fill-opacity="0.65" />
  <circle cx="244" cy="156" r="8" fill="#f1f5f3" fill-opacity="0.35" />
  <text x="800" y="387" fill="#f1f5f3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" text-anchor="middle">PRODUCT WORKSPACE MEDIA</text>
  <text x="800" y="447" fill="#b9f7d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" text-anchor="middle">SCREENSHOT PLACEHOLDER</text>
  <path d="M590 508 H1010" stroke="#b9f7d4" stroke-opacity="0.35" stroke-width="2" />
  <text x="800" y="566" fill="#d2dcd7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle">Replace statsplayground-workspace.webp</text>
  <text x="800" y="600" fill="#d2dcd7" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">Recommended: 1600 x 900 or larger</text>
</svg>