name: Release Portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_SOURCE_ROOT: source
    steps:
      - name: Check out release automation
        uses: actions/checkout@v4
        with:
          path: automation
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize release version
        run: node automation/scripts/syncReleaseVersion.mjs
      - run: npm ci
        working-directory: source
      - run: node --test automation/scripts/portableBuildCore.test.mjs
      - name: Stage release automation in tagged source
        run: |
          cp automation/scripts/buildPortable.mjs source/scripts/buildPortable.mjs
          cp automation/scripts/compressPortable.ps1 source/scripts/compressPortable.ps1
          cp automation/scripts/portableBuildCore.mjs source/scripts/portableBuildCore.mjs
      - run: node source/scripts/buildPortable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ci-transfer-${{ runner.os }}-${{ runner.arch }}
          path: source/release/portable/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-transfer-*
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: StatsPlayground ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t desired_assets < <(find release-artifacts -maxdepth 1 -type f -exec basename {} \; | sort)
          while IFS= read -r asset; do
            keep=false
            for desired in "${desired_assets[@]}"; do
              if [[ "$asset" == "$desired" ]]; then
                keep=true
                break
              fi
            done
            if [[ "$keep" == false ]]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
