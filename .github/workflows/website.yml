name: Deploy official website

on:
  push:
    branches: [dev]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify production media
        run: |
          if [ -f website/public/images/PLACEHOLDER_MEDIA.md ]; then
            cat website/public/images/PLACEHOLDER_MEDIA.md
            exit 1
          fi
      - name: Install, build, and upload website
        uses: withastro/action@v6
        with:
          path: website
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5