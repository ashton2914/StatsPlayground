[package]
name = "stats-playground"
version = "0.1.0"
description = "An ultra-lightweight, open-source, and extensible data analysis tool"
authors = ["StatsPlayground Contributors"]
edition = "2021"

[lib]
name = "stats_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
perf-harness = []

[[example]]
name = "performance_baseline"
required-features = ["perf-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
duckdb = { version = "1.10505.0", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sqlparser = "0.62.0"
statrs = "0.19.1"
argmin = "0.11.0"
sha2 = "0.10.9"
nalgebra = "0.35.0"

[dev-dependencies]
proptest = "1.7.0"

[dev-dependencies]
proptest = "1.7.0"

[profile.dev]
incremental = true

[profile.dev.package.libduckdb-sys]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
