[package]
name = "stats-playground"
version = "0.1.0"
description = "An ultra-lightweight, open-source, and extensible data analysis tool"
authors = ["StatsPlayground Contributors"]
edition = "2021"

[lib]
name = "stats_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
perf-harness = []

[[example]]
name = "performance_baseline"
required-features = ["perf-harness"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
duckdb = { version = "1.10505.0", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
rustls-pemfile = "2"
mysql = { version = "26", default-features = false, features = ["minimal-rust", "native-tls"] }
tempfile = "3"
fallible-iterator = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sqlparser = "0.62.0"
statrs = "0.19.1"
argmin = "0.11.0"
sha2 = "0.10.9"
nalgebra = "0.35.0"
wgpu = "=30.0.1"
bytemuck = { version = "=1.24.0", features = ["derive"] }
pollster = "=0.4.0"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
rmcp = { version = "=3.3.0", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
rand = "0.9"
base64 = "0.22"
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
proc-macro2 = "1.0.107"
proptest = "1.7.0"
syn = { version = "=3.0.5", features = ["full", "visit"] }
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
incremental = true

[profile.dev.package.libduckdb-sys]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
